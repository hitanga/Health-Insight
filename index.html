    <script>
      // If a user visits an old hash route, normalize to clean pathname
      if (window.location.hash && window.location.hash.startsWith('#/')) {
        var cleanPath = window.location.hash.substring(1);
        window.history.replaceState(null, '', cleanPath);
      }
